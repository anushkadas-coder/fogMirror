<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fog Mirror</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--bg:#e9e4f0;--fg:#3a3347;--pill:rgba(255,255,255,.72);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141d;--fg:#f1ecf8;--pill:rgba(30,26,40,.72)}}
:root[data-theme="dark"]{--bg:#17141d;--fg:#f1ecf8;--pill:rgba(30,26,40,.72)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:relative;width:100%;height:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#top{position:absolute;left:0;right:0;top:0;padding:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
h1{margin:0;font:400 2.1rem "Pinyon Script",cursive,serif;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.4)}
#bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;pointer-events:none}
button,.pill{pointer-events:auto;border:0;border-radius:999px;padding:8px 14px;background:var(--pill);color:var(--fg);font:inherit;font-size:.8rem;backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;gap:6px}
button.on{background:#fff;color:#a2467a;font-weight:600}
#rec.on{color:#d11}
.pill input{width:80px;accent-color:#a2467a}
#hint{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:90%;bottom:70px;text-align:center;background:rgba(0,0,0,.45);border-radius:999px;padding:6px 14px;font-size:.85rem;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none;transition:opacity .6s;padding:0 16px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <video id="v" playsinline muted autoplay></video>
  <div id="top"><h1 style="visibility:hidden">fog mirror</h1><button id="clr">clear</button></div>
  <div id="hint">starting camera…</div>
  <div id="bar">
    <label class="pill">fade <input id="fade" type="range" min="2" max="14" value="6"></label>
    <label class="pill">brush <input id="size" type="range" min="10" max="60" value="28"></label>
    <button id="air">✋ hand tracking</button>
    <button id="rec">⏺ record</button>
    <span class="pill" id="st" style="cursor:default">hand: off</span>
  </div>
</div>
<script type="module">
import {HandLandmarker,FilesetResolver} from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
(function(){
  var $=function(i){return document.getElementById(i)};
  var cv=$('c'),ctx=cv.getContext('2d'),vid=$('v'),hint=$('hint');
  function mk(){var c=document.createElement('canvas');return[c,c.getContext('2d')]}
  var s=mk(),small=s[0],sctx=s[1],l=mk(),layer=l[0],lctx=l[1],m=mk(),mask=m[0],mctx=m[1],d=mk(),drops=d[0],dctx=d[1];
  var mo=mk(),mot=mo[0],mtx=mo[1];mot.width=64;mot.height=48;
  var grain=mk(),gc=grain[0],gx=grain[1];gc.width=gc.height=128;
  var gi=gx.createImageData(128,128);for(var i=0;i<gi.data.length;i+=4){var v=200+Math.random()*55;gi.data[i]=gi.data[i+1]=gi.data[i+2]=v;gi.data[i+3]=Math.random()*38}
  gx.putImageData(gi,0,0);
  var W=0,H=0,live=false,strokes=[],last=null,FADE=6000,BRUSH=28,air=false;

  function resize(){
    var dpr=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth;H=cv.clientHeight;
    [cv,layer,mask,drops].forEach(function(c){c.width=W*dpr;c.height=H*dpr});
    [ctx,lctx,mctx,dctx].forEach(function(x){x.setTransform(dpr,0,0,dpr,0,0)});
    small.width=48;small.height=Math.max(8,Math.round(48*H/W));
    mot.height=Math.max(16,Math.round(64*H/W));
    // condensation droplets, drawn once
    var n=Math.round(W*H/2600);
    for(var i=0;i<n;i++){
      var x=Math.random()*W,y=Math.random()*H,r=1+Math.pow(Math.random(),3)*5;
      var g=dctx.createRadialGradient(x-r*.3,y-r*.3,0,x,y,r);
      g.addColorStop(0,'rgba(255,255,255,.85)');g.addColorStop(.7,'rgba(255,255,255,.25)');g.addColorStop(1,'rgba(120,130,160,.22)');
      dctx.fillStyle=g;dctx.beginPath();dctx.arc(x,y,r,0,7);dctx.fill();
    }
  }
  window.addEventListener('resize',function(){strokes=[];resize()});resize();

  function drawSrc(x,w,h){
    x.save();x.translate(w,0);x.scale(-1,1);
    if(live&&vid.videoWidth){
      var k=Math.max(w/vid.videoWidth,h/vid.videoHeight),dw=vid.videoWidth*k,dh=vid.videoHeight*k;
      x.drawImage(vid,(w-dw)/2,(h-dh)/2,dw,dh);
    }else{
      var g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#2b2f55');g.addColorStop(.5,'#c0698f');g.addColorStop(1,'#f3b57a');
      x.fillStyle=g;x.fillRect(0,0,w,h);
    }
    x.restore();
  }

  // real hand tracking (MediaPipe): point with ONE finger to draw
  var MODEL='https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
  var lm=null,loading=false,lastT=-1,tip=null,dots=null,stTxt='',palmT=0,palmP=null,cool=0,rec=false;
  function setSt(t){if(t!==stTxt){stTxt=t;$('st').textContent=t}}
  async function initHands(){
    if(lm||loading)return;loading=true;hint.style.opacity=1;hint.textContent='loading hand model…';$('st').textContent='hand: loading model…';
    try{
      var fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      var opts=function(dl){return{baseOptions:{modelAssetPath:MODEL,delegate:dl},runningMode:'VIDEO',numHands:1}};
      try{lm=await HandLandmarker.createFromOptions(fs,opts('GPU'))}catch(e){lm=await HandLandmarker.createFromOptions(fs,opts('CPU'))}
      hint.textContent='point with one finger to draw. open hand or fist lifts the pen';$('st').textContent='hand: ready, show your hand';
    }catch(e){console.error(e);hint.textContent='hand model failed to load: '+e.message;$('st').textContent='hand: error (see console F12)'}
    loading=false;
  }
  function hand(){
    if(!lm||vid.readyState<2||vid.currentTime===lastT)return;
    lastT=vid.currentTime;
    var r=lm.detectForVideo(vid,performance.now());
    if(!r.landmarks||!r.landmarks.length){tip=null;dots=null;setSt('hand: not seen');return}
    var L=r.landmarks[0],vw=vid.videoWidth,vh=vid.videoHeight;
    var D=function(i,j){return Math.hypot((L[i].x-L[j].x)*vw,(L[i].y-L[j].y)*vh)};
    var E=function(t,p,f){return D(0,t)>D(0,p)*(f||1.1)};
    var idx=E(8,6,1.05),mid=E(12,10),rng=E(16,14),pky=E(20,18);
    var pinch=D(4,8)<D(0,5)*0.5,mode='draw';
    if(pinch&&mid&&rng&&pky)mode='size';
    else if(idx&&mid&&rng&&pky)mode='palm';
    var draw=mode==='draw'&&idx&&!E(12,10,1.2)&&!E(16,14,1.2);
    var k=Math.max(W/vw,H/vh),dw=vw*k,dh=vh*k;
    dots=L.map(function(p){return{x:W-(p.x*vw*k+(W-dw)/2),y:p.y*vh*k+(H-dh)/2}});
    var now=performance.now();
    if(mode==='palm'&&now>cool){
      if(!palmT)palmT=now;
      var pr=(now-palmT)/800;palmP={x:dots[9].x,y:dots[9].y,p:pr};setSt('hand: hold to clear…');
      if(pr>=1){strokes=[];cool=now+1500;palmT=0;palmP=null;setSt('hand: cleared')}
    }else{palmT=0;palmP=null}
    if(mode==='size'){var sz=Math.round(10+(1-Math.min(1,Math.max(0,dots[9].y/H)))*50);BRUSH=sz;$('size').value=sz;setSt('hand: brush '+sz)}
    if(mode==='draw')setSt(draw?'hand: drawing ✍️':'hand: seen, pen up');
    var x=dots[8].x,y=dots[8].y;
    if(!tip)tip={x:x,y:y,pen:false};
    var nx=tip.x+(x-tip.x)*.5,ny=tip.y+(y-tip.y)*.5;
    if(draw&&tip.pen)add({x:tip.x,y:tip.y},{x:nx,y:ny});
    tip.x=nx;tip.y=ny;tip.pen=draw;
  }

  function frame(){
    var now=performance.now();
    if(air&&live)hand();
    drawSrc(sctx,small.width,small.height);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(small,0,0,W,H);
    ctx.fillStyle='rgba(232,238,250,.64)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle=ctx.createPattern(gc,'repeat');ctx.fillRect(0,0,W,H);
    ctx.drawImage(drops,0,0,W,H);
    mctx.clearRect(0,0,W,H);
    strokes=strokes.filter(function(q){return now-q.t<FADE});
    mctx.lineCap='round';mctx.lineJoin='round';mctx.shadowColor='#000';mctx.shadowBlur=BRUSH*.25;
    strokes.forEach(function(q){
      var a=Math.min(1,(1-(now-q.t)/FADE)*1.7);
      mctx.strokeStyle='rgba(0,0,0,'+a+')';mctx.lineWidth=q.w*(0.55+0.45*a);
      mctx.beginPath();mctx.moveTo(q.x1,q.y1);mctx.lineTo(q.x2,q.y2);mctx.stroke();
    });
    lctx.globalCompositeOperation='source-over';lctx.clearRect(0,0,W,H);
    drawSrc(lctx,W,H);
    lctx.globalCompositeOperation='destination-in';lctx.drawImage(mask,0,0,W,H);
    ctx.drawImage(layer,0,0,W,H);
    ctx.save();ctx.font='34px "Pinyon Script",cursive,serif';ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=10;ctx.fillText('fog mirror',16,46);ctx.restore();
    if(palmP){ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=5;ctx.beginPath();ctx.arc(palmP.x,palmP.y,40,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,palmP.p));ctx.stroke()}
    if(air&&dots&&!rec){ctx.fillStyle='rgba(255,255,255,.8)';dots.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill()})}
    if(air&&tip&&!rec){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(tip.x,tip.y,BRUSH/2+4,0,7);ctx.stroke();if(tip.pen){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fill()}}
    requestAnimationFrame(frame);
  }

  function pt(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.addEventListener('pointerdown',function(e){if(air)return;cv.setPointerCapture(e.pointerId);last=pt(e);add(last,last);hint.style.opacity=0});
  cv.addEventListener('pointermove',function(e){if(!last)return;var p=pt(e);add(last,p);last=p});
  ['pointerup','pointercancel'].forEach(function(n){cv.addEventListener(n,function(){last=null})});
  function add(a,b){
    var dist=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(dist/5)),px=a.x,py=a.y,t=performance.now();
    var w=BRUSH*Math.max(.55,1-dist/90); // faster = thinner, like ink
    for(var i=1;i<=n;i++){var x=a.x+(b.x-a.x)*i/n,y=a.y+(b.y-a.y)*i/n;strokes.push({x1:px,y1:py,x2:x,y2:y,t:t,w:w});px=x;py=y}
  }
  $('clr').onclick=function(){strokes=[]};
  var recorder=null,chunks=[],t0=0,tm=null;
  $('rec').onclick=function(){
    var b=this;
    if(rec){recorder.stop();return}
    if(!window.MediaRecorder||!cv.captureStream){hint.style.opacity=1;hint.textContent='recording is not supported in this browser';return}
    var types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    var mt=types.find(function(t){return MediaRecorder.isTypeSupported(t)})||'';
    chunks=[];
    recorder=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:6000000}:{});
    recorder.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
    recorder.onstop=function(){
      rec=false;clearInterval(tm);b.classList.remove('on');b.textContent='⏺ record';
      var blob=new Blob(chunks,{type:recorder.mimeType||'video/webm'}),a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download='fog-mirror-'+Date.now()+(blob.type.indexOf('mp4')>-1?'.mp4':'.webm');
      document.body.appendChild(a);a.click();a.remove();
      hint.style.opacity=1;hint.textContent='saved '+a.download+' to your Downloads';
    };
    recorder.start();rec=true;t0=Date.now();b.classList.add('on');b.textContent='⏹ stop 0:00';hint.style.opacity=0;
    tm=setInterval(function(){var q=Math.floor((Date.now()-t0)/1000);b.textContent='⏹ stop '+Math.floor(q/60)+':'+('0'+q%60).slice(-2)},500);
  };
  if(document.fonts&&document.fonts.load)document.fonts.load('34px "Pinyon Script"');
  $('fade').oninput=function(){FADE=this.value*1000};
  $('size').oninput=function(){BRUSH=+this.value};
  $('air').onclick=function(){
    if(!live){hint.style.opacity=1;hint.textContent='hand tracking needs the camera';return}
    air=!air;this.classList.toggle('on',air);tip=null;
    if(air)initHands();else{dots=null;$('st').textContent='hand: off';hint.style.opacity=1;hint.textContent='draw on the glass with your finger or mouse'}
  };

  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
    navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false}).then(function(st){
      vid.srcObject=st;vid.play();live=true;hint.textContent='draw with your mouse, or tap ✋ for hand tracking';$('air').click();
    }).catch(function(){hint.textContent='camera blocked. showing a demo scene. draw on it!'});
  }else hint.textContent='no camera available. draw on the demo scene';
  frame();
})();
</script>
</body>
</html>
